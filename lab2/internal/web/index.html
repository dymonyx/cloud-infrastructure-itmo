<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chainwise · Observability Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { max-width: 820px; margin: 64px auto; padding: 0 24px; }
    h1 { margin-bottom: 8px; font-size: 40px; }
    p { color: #9ca3af; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 32px 0; }
    button { min-height: 96px; border: 0; border-radius: 14px; padding: 18px; color: white; font-size: 17px; font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .error { background: #b91c1c; }
    .delay { background: #b45309; }
    .load { background: #0369a1; }
    pre { min-height: 140px; padding: 18px; overflow: auto; border: 1px solid #374151; border-radius: 14px; background: #030712; color: #d1fae5; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
<main>
  <h1>Chainwise bike-api</h1>
  <p>Тестовая страница лабораторной по observability. Кнопки создают контролируемые ошибки, задержки и всплески RPS.</p>
  <div class="grid">
    <button class="error" data-url="/bike/demo/error">Вызвать ошибку</button>
    <button class="delay" data-url="/bike/demo/delay">Вызвать задержку</button>
    <button class="load" data-url="/bike/demo/load?count=120">Создать нагрузку</button>
  </div>
  <p>Последний результат:</p>
  <pre id="result">Нажми одну из кнопок.</pre>
  <p>Служебные маршруты: <code>/metrics</code>, <code>/healthz</code>, <code>/readyz</code>.</p>
</main>
<script>
  const result = document.getElementById('result');
  for (const button of document.querySelectorAll('button')) {
    button.addEventListener('click', async () => {
      button.disabled = true;
      result.textContent = 'Выполняется запрос…';
      try {
        const response = await fetch(button.dataset.url);
        const body = await response.text();
        const traceId = response.headers.get('X-Trace-ID') || 'нет';
        result.textContent = `HTTP ${response.status}\ntrace_id: ${traceId}\n\n${body}`;
      } catch (error) {
        result.textContent = String(error);
      } finally {
        button.disabled = false;
      }
    });
  }
</script>
</body>
</html>
