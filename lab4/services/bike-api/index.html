<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chainwise · Kafka producer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #e5e7eb; }
    main { max-width: 960px; margin: 48px auto; padding: 0 24px; }
    h1 { margin: 0 0 8px; font-size: 38px; }
    p { color: #a5b4c7; line-height: 1.5; }
    .panel { margin: 28px 0; padding: 22px; border: 1px solid #27324a; border-radius: 16px; background: #111a2e; }
    form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
    label { display: grid; gap: 7px; color: #cbd5e1; font-size: 14px; }
    input, button { height: 44px; border-radius: 10px; font: inherit; }
    input { border: 1px solid #475569; background: #080d19; color: white; padding: 0 12px; }
    button { border: 0; background: #16a34a; color: white; padding: 0 20px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid #27324a; text-align: left; }
    th { color: #93c5fd; font-size: 13px; }
    code { color: #86efac; }
    .status { min-height: 24px; color: #facc15; }
    @media (max-width: 720px) { form { grid-template-columns: 1fr; } table { font-size: 13px; } }
  </style>
</head>
<body>
<main>
  <h1>Chainwise bike-api</h1>
  <p>Producer публикует событие <code>trip-recorded</code> в Kafka и показывает метаданные, возвращённые брокером.</p>
  <section class="panel">
    <form id="trip-form">
      <label>Велосипед<input id="bike-id" value="bike-demo-001" required></label>
      <label>Расстояние, км<input id="distance" type="number" min="0.1" max="1000" step="0.1" value="12.5" required></label>
      <button type="submit">Записать поездку</button>
    </form>
    <p class="status" id="status">Готово к отправке.</p>
  </section>
  <section class="panel">
    <h2>Опубликованные события</h2>
    <table>
      <thead><tr><th>trip_id</th><th>distance</th><th>partition</th><th>offset</th><th>time</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
  </section>
</main>
<script>
  const form = document.getElementById('trip-form');
  const status = document.getElementById('status');
  const events = document.getElementById('events');

  function draw(items) {
    events.innerHTML = items.map(item => `<tr>
      <td><code>${item.trip_id}</code></td><td>${item.distance_km} км</td>
      <td>${item.partition}</td><td>${item.offset}</td><td>${new Date(item.recorded_at).toLocaleTimeString()}</td>
    </tr>`).join('') || '<tr><td colspan="5">Событий пока нет</td></tr>';
  }

  async function refresh() {
    const response = await fetch('/api/trips');
    const body = await response.json();
    draw(body.items || []);
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    status.textContent = 'Публикация в Kafka…';
    try {
      const response = await fetch('/api/trips', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({bike_id: document.getElementById('bike-id').value, distance_km: Number(document.getElementById('distance').value)})
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
      status.textContent = `Отправлено: partition ${body.partition}, offset ${body.offset}`;
      await refresh();
    } catch (error) {
      status.textContent = `Ошибка: ${error.message}`;
    } finally { button.disabled = false; }
  });

  refresh().catch(error => status.textContent = `Ошибка загрузки: ${error.message}`);
  setInterval(() => refresh().catch(() => {}), 3000);
</script>
</body>
</html>
