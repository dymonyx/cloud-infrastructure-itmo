name: chainwise-lab4

x-worker-common: &worker-common
  build:
    context: .
    dockerfile: services/maintenance-worker/Dockerfile
  environment:
    KAFKA_BROKERS: kafka:29092
    KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
    KAFKA_GROUP: ${KAFKA_GROUP:-maintenance-workers}
    PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-800}
    PORT: 8082
  depends_on:
    topic-controller:
      condition: service_completed_successfully
  restart: unless-stopped
  mem_limit: 128m
  networks: [chainwise]

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: chainwise-lab4-kraft-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-172800000}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    networks: [chainwise]

  topic-controller:
    build:
      context: .
      dockerfile: tools/topic-controller/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-172800000}
      KAFKA_SEGMENT_MS: ${KAFKA_SEGMENT_MS:-10000}
      KAFKA_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    mem_limit: 96m
    networks: [chainwise]

  bike-api:
    build:
      context: .
      dockerfile: services/bike-api/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      topic-controller:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 128m
    networks: [chainwise]

  maintenance-worker-1:
    <<: *worker-common
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
      KAFKA_GROUP: ${KAFKA_GROUP:-maintenance-workers}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-800}
      INSTANCE_NAME: maintenance-worker-1
      PORT: 8082
    ports:
      - "8082:8082"

  maintenance-worker-2:
    <<: *worker-common
    profiles: [scale]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
      KAFKA_GROUP: ${KAFKA_GROUP:-maintenance-workers}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-800}
      INSTANCE_NAME: maintenance-worker-2
      PORT: 8082
    ports:
      - "8083:8082"

  maintenance-worker-3:
    <<: *worker-common
    profiles: [overflow]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
      KAFKA_GROUP: ${KAFKA_GROUP:-maintenance-workers}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-800}
      INSTANCE_NAME: maintenance-worker-3
      PORT: 8082
    ports:
      - "8084:8082"

  maintenance-worker-4:
    <<: *worker-common
    profiles: [overflow]
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trip-recorded}
      KAFKA_GROUP: ${KAFKA_GROUP:-maintenance-workers}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-800}
      INSTANCE_NAME: maintenance-worker-4
      PORT: 8082
    ports:
      - "8085:8082"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: chainwise
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms64m -Xmx256m
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    networks: [chainwise]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:29092
      - --topic.filter=${KAFKA_TOPIC:-trip-recorded}
      - --group.filter=${KAFKA_GROUP:-maintenance-workers}
      - --refresh.metadata=10s
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    networks: [chainwise]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
      - bike-api
      - maintenance-worker-1
    restart: unless-stopped
    mem_limit: 384m
    networks: [chainwise]

  grafana:
    image: grafana/grafana:13.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 1g
    networks: [chainwise]

networks:
  chainwise:
    name: chainwise-lab4

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
