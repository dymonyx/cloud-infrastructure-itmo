global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: bike-api
    static_configs:
      - targets: [bike-api:8081]

  - job_name: maintenance-workers
    static_configs:
      - targets: [maintenance-worker-1:8082]
