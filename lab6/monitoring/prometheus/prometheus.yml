global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bike-api
    static_configs:
      - targets:
          - bike-api:8080

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter-primary:9187
        labels:
          database_role: primary
      - targets:
          - postgres-exporter-standby:9187
        labels:
          database_role: standby

